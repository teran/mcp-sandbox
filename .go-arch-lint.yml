# go-arch-lint v3 (C07GO). Layers follow the DDD/Clean top-level package layout
# (A01): cmd → application + infrastructure; application → domain;
# infrastructure → domain. domain is a leaf and depends on nothing.
version: 3

workdir: .

allow:
  depOnAnyVendor: true

components:
  cmd:
    in: cmd/**
  application:
    in: application/**
  infrastructure:
    in: infrastructure/**
  domain:
    in: domain/**

deps:
  cmd:
    mayDependOn:
      - application
      - infrastructure
  application:
    mayDependOn:
      - domain
  # infrastructure may also depend on other infrastructure packages: the
  # backend factory registry (infrastructure/backend) is imported by the
  # concrete backends (e.g. infrastructure/backend/docker) to register
  # themselves via init() (SPEC §6.3). Cross-infrastructure edges are limited
  # to this adapter wiring.
  infrastructure:
    mayDependOn:
      - domain
      - infrastructure
  # domain is a leaf: it may only depend on other domain packages (self),
  # never on application/infrastructure/cmd.
  domain:
    mayDependOn:
      - domain
