# Working operator profile for live-testing the darwin (sandbox-exec / Seatbelt)
# backend on macOS. Hybrid driver-aware schema (SPEC §7.11/§7.12).
#
# `driver: seatbelt` selects the darwin backend and requires the matching
# `seatbelt` options under the opaque `options:` block (mutually exclusive with
# `docker`). The darwin backend has
# no container/image: the server renders the Seatbelt (SBPL) profile from the
# typed SandboxSpec — imports → `(deny default)` → network → mach → sysctl →
# file (ALLOW_DIRS + session cwd, S04) → operator `seatbelt.sbpl` below. The
# operator template is appended LAST, so it is where an operator selectively
# re-opens surfaces the server baseline denies.
#
# This is a VERIFIED file-deny-all profile (validated live against a real
# macOS host; `make lint` + `make test` + `make build` all pass under it).
# Replace `/Users/<username>` below with the real repo owner's home path.
#
# Scope decisions (understand before widening):
#   - `(allow default)` is required at the top for NON-file system operations
#     (process-exec, mach-lookup, iokit, syscall, ipc). macOS 26 (SBPL version
#     3) cannot start /bin/bash under a hand-listed deny-all of those — the
#     runtime requires dozens of operations. This mirrors Bazel's own
#     DarwinSandboxedSpawnRunner profile. The `(deny default)` baseline is
#     overridden only by this operator template, which is appended last.
#   - FILE access IS deny-all: `(deny file-read*)` + `(deny file-write*)` close
#     everything, and only the explicit `(allow ...)` lists below re-open:
#       * file-read: system dylib/toolchain dirs (unavoidable for macOS to load
#         ANY binary), /private/etc/ssl (TLS config for curl/openssl), the
#         homebrew + go toolchain, and the single repo root this sandbox works
#         on (cwd). Nothing else on the host is readable — .ssh, .aws, Movies,
#         Documents, /etc/hosts, ~/.config/... are all denied without listing
#         each one.
#       * file-write: only the cwd (repo root), /dev and temp dirs.
#   - `(allow file-read-metadata)` is granted GLOBALLY: it exposes only stat /
#     readlink (no file contents), which tools need to resolve path components
#     (EvalSymlinks, realpath, go/golangci-lint, make). It is safe to grant
#     broadly because it never reveals data.
#   - `(allow network-outbound)` permits outbound connections (curl/git fetch).
#
# Two hard constraints from the darwin backend (SPEC §7.12):
#   1. `shell` MUST be an ABSOLUTE path. sandbox-exec does `execvp("bash")`
#      against the SERVER process PATH (not the per-exec env), so a bare
#      `bash` fails with `execvp() of 'bash' failed: No such file or directory`
#      even under `(allow default)` when the server PATH omits /bin.
#   2. macOS cannot start ANY binary unless the dyld chain is readable, so the
#      system dirs (/usr/lib, /System/Library, /usr/bin, /bin) must remain in
#      file-read scope. This is inherent to sandbox-exec on macOS, not a leak.
#
# Note: `(debug deny)` / `seatbelt.debug_deny` does NOT work on macOS 26 — the
# `debug` macro is absent from system.sb (SBPL version 3) and fails to compile.
# Do not rely on it for diagnostics.
name: seatbelt
description: >-
  Verified file-deny-all profile for the darwin (sandbox-exec) backend on macOS.
  driver=seatbelt; server-rendered SBPL + operator template. File access is
  deny-all: read/write only in the repo root (cwd) plus the system dirs macOS
  needs to load binaries; outbound network allowed.
driver: seatbelt
options:
  # Optional operator-authored environment variables for the sandbox session,
  # delivered via spec.Env -> cmd.Env (S02: do not put secrets here; use tmpfs
  # 0600 secret files under /run/sandbox instead).
  env:
    GIT_AUTHOR_NAME: "Igor Shishkin"
    GIT_AUTHOR_EMAIL: "me@teran.dev"
    GIT_COMMITTER_NAME: "Igor Shishkin"
    GIT_COMMITTER_EMAIL: "me@teran.dev"
  # Operator SBPL template, merged AFTER the server's deny-default hardening.
  # In Seatbelt the LAST matching rule wins, so these rules override the
  # baseline. FILE access is deny-all (only the listed paths re-open); the
  # `(allow default)` covers only non-file system operations (unavoidable).
  # file-read-metadata is granted globally (safe: metadata only, no contents).
  sbpl: |
    (allow default)
    (allow network-outbound)
    (deny file-read*)
    (allow file-read*
      (subpath "/usr/lib")
      (subpath "/usr/share")
      (subpath "/System/Library")
      (subpath "/bin")
      (subpath "/usr/bin")
      (subpath "/dev")
      (subpath "/private/etc/ssl")
      (subpath "/var/select")
      (subpath "/Library/Developer")
      (subpath "/opt/homebrew")
      (subpath "/usr/local/go")
      (subpath "/usr/local/bin")
      (subpath "/Users/<username>/go")
      (subpath "/Users/<username>/Downloads/Code/Git")
      (subpath "/private")
      (literal "/Users/<username>/.gitconfig"))
    (allow file-read-metadata)
    (deny file-write*)
    (allow file-write*
      (subpath "/Users/<username>/Downloads/Code/Git")
      (subpath "/dev")
      (subpath "/private/tmp")
      (subpath "/private/var/folders")
      (subpath "/tmp"))
  mach_lookups: []
  sysctls: []
cwd:
  mode: rw
shell: /bin/bash
