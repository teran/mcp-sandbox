# golangci-lint v2 configuration (C03GO).
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - revive
    - unconvert
    - whitespace
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - contextcheck
    - copyloopvar
    - decorder
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errchkjson
    - errname
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocognit
    - gocritic
    - gocyclo
    - godox
    - gomoddirectives
    - goprintffuncname
    - govet
    - grouper
    - iface
    - importas
    - ineffassign
    - intrange
    - iotamixing
    - maintidx
    - makezero
    - mirror
    - misspell
    - musttag
    - nestif
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - predeclared
    - reassign
    - recvcheck
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - modernize
    - ireturn
    - interfacebloat
    - godot
    - dupword
    - nakedret
    - lll
    - funlen
    - mnd
    - nlreturn
    - varnamelen
    - godoclint
  settings:
    ireturn:
      allow:
        - error
        - empty
        - stdlib
        - anon
        - ^github\.com/teran/mcp-sandbox/application/tools/handler\.TraceLogger$
        - ^github\.com/modelcontextprotocol/go-sdk/mcp\.Transport$
        - ^github\.com/teran/mcp-sandbox/domain/sandbox/role\.Backend$
    nakedret:
      max-func-lines: 30
    lll:
      line-length: 130
    funlen:
      lines: 60
      statements: 40
    varnamelen:
      # This is a test-heavy, AI-generated codebase where short idiomatic Go
      # names (table-test vars, logger/event/repo receivers) are pervasive and
      # conventional. Scope the linter to genuinely unclear long-scope names:
      # flag nothing below 3 chars, never complain about return values, and
      # allowlist the idiomatic short identifiers below.
      min-name-length: 3
      check-return: false
      ignore-names:
        - ctx
        - id
        - ok
        - err
        - t
        - tt
        - w
        - wg
        - fd
        - db
        - ch
        - in
        - out
        - b
        - i
        - j
        - k
        - n
        - m
        - x
        - y
        - c
        - d
        - e
        - v
        - s
        - p
        - r
        - f
        - o
        - a
        - g
        - l
        - h
        - w
        - mu
        - ev
        - eo
        - al
        - tl
        - sp
        - cs
        - fb
        - hc
        - cg
        - st
        - tm
        - ps
        - lo
        - dl
        - cf
        - be
    godoclint:
      # The codebase is AI-generated with extensive godoc; the only noise is the
      # `single-pkg-doc` rule flagging the conventional pattern of a package
      # comment in every file of a package. Keep the value-adding rules
      # (require-doc, start-with-name, max-len, no-unused-link, deprecated,
      # require-stdlib-doclink) and disable that one via config, not mass edits.
      disable:
        - single-pkg-doc
  exclusions:
    rules:
      # Test code may ignore errors in setup/cleanup helpers without noise.
      - path: _test\.go
        linters:
          - errcheck
          - govet

formatters:
  enable:
    - gofmt
    - gofumpt
  settings:
    gofmt:
      simplify: true
