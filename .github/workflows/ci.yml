# mcp-sandbox CI (R06: GitHub Actions).
#
# CI binds to the make build-system interface (R07) — jobs call `make <target>`,
# never raw language commands. CI is read-only over the working tree (N36).
# Triggers on the default branch `master` (R02) and on pull requests; the
# release job publishes goreleaser binaries on `v*` tags (B01/B02).
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.2"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install linters
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/fe3dback/go-arch-lint@v1.19.0
          go install mvdan.cc/gofumpt@v0.12.0
      - name: Lint
        run: make lint

  unit:
    name: Unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Test (race + coverage ≥ 95%)
        run: make test

  # Darwin (macOS) — explicit stage for `//go:build darwin` code (SPEC §7.12).
  # The unit matrix above already runs `make test` on macOS, so darwin-tagged
  # tests compile and execute there. This job additionally runs `make lint` on
  # macOS: golangci-lint honours GOOS, so on a macOS runner it also lints
  # `_darwin.go` files that the ubuntu-only `lint` job (GOOS=linux) excludes.
  # Safe today (no darwin code yet): lint behaves like on Linux. Darwin e2e
  # smoke tests are `//go:build e2e && darwin` and run under the generic
  # `make e2e` on the dedicated `e2e` job below (macos-latest); the separate
  # `e2e-darwin` target is intentionally not needed (C09GO/N07GO/T02/N31).
  darwin:
    name: Darwin (macOS) — lint + test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install linters
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/fe3dback/go-arch-lint@v1.19.0
          go install mvdan.cc/gofumpt@v0.12.0
      - name: Lint (incl. darwin-tagged files)
        run: make lint
      - name: Test (darwin — compiles & runs //go:build darwin tests)
        run: make test

  e2e:
    name: E2E (darwin smoke)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: E2E smoke (build-tagged, darwin sandbox-exec)
        run: make e2e

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Test with coverage gate
        run: make test
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  arch:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install go-arch-lint
        run: go install github.com/fe3dback/go-arch-lint@v1.19.0
      - name: Check architecture
        run: make arch

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install scanners
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Security scan (gosec + govulncheck)
        run: make security-scan

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install goreleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.18.3
      - name: Build (goreleaser)
        run: make build

  mutation:
    name: Mutation (gremlins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Mutation testing (80/80)
        run: make mutate

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install goreleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.18.3
      - name: Release (goreleaser)
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
