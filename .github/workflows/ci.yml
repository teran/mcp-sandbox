# mcp-sandbox CI (R06: GitHub Actions).
#
# CI binds to the make build-system interface (R07) — jobs call `make <target>`,
# never raw language commands. CI is read-only over the working tree (N36).
# Triggers on the default branch `master` (R02) and on pull requests.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install linters
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/fe3dback/go-arch-lint@v1.19.0
          go install mvdan.cc/gofumpt@v0.12.0
      - name: Lint
        run: make lint

  unit:
    name: Unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Test (race + coverage ≥ 95%)
        run: make test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Test with coverage gate
        run: make test
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  arch:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install go-arch-lint
        run: go install github.com/fe3dback/go-arch-lint@v1.19.0
      - name: Check architecture
        run: go-arch-lint check

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install scanners
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: gosec
        run: gosec -quiet ./...
      - name: govulncheck
        run: scripts/govulncheck.sh

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: E2E (go-docker-testsuite)
        run: make e2e

  mutation:
    name: Mutation (gremlins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Mutation testing (80/80)
        run: make mutate

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
